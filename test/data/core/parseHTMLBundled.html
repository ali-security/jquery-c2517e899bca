<!DOCTYPE html>
<html lang="en">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Bundled jQuery copy: jQuery.parseHTML doesn't run inline event handlers (sonatype-2014-0026)</title>
	<script src="../../../src/sizzle/test/jquery.js"></script>
	<script>
		window.sizzleTestjQuery = jQuery.noConflict( true );
	</script>
</head>
<body>
	<script>
		// "xss(#)" is swapped for a recorder call carrying a per-payload index.
		var template = "<img src=url404 onerror=xss(#)>",
			result;

		function check( $ ) {
			var i, nodes,
				// Context-less calls must not run the inline event handler
				calls = [
					[ "jQuery.parseHTML( html )", function( html ) {
						$.parseHTML( html );
					} ],
					[ "jQuery.parseHTML( html, true )", function( html ) {
						$.parseHTML( html, true );
					} ],
					[ "jQuery.parseHTML( html, null, true )", function( html ) {
						$.parseHTML( html, null, true );
					} ]
				],
				outcome = {
					version: $.fn.jquery,
					supportCreateHTMLDocument: $.support.createHTMLDocument,
					controlFired: false,
					executed: []
				};

			function payload( index ) {
				return template.replace( "xss(#)", "xss_sizzle(" + index + ")" );
			}

			window.xss_sizzle = function( index ) {
				if ( index === calls.length ) {
					outcome.controlFired = true;
				} else {
					outcome.executed.push( calls[ index ][ 0 ] );
				}
			};

			for ( i = 0; i < calls.length; i++ ) {
				calls[ i ][ 1 ]( payload( i ) );
			}

			// Control: an explicit live-document context still parses in that
			// document (as jQuery( html ) does), so the handler does fire there.
			// This proves the payload is live in this browser.
			$.parseHTML( payload( calls.length ), document );

			// Parsed URLs still resolve against the page URL (gh-2965)
			outcome.anchorHref = $.parseHTML( "<a href='test.html'></a>" )[ 0 ].href;

			// Parsed nodes still work once inserted into the page
			nodes = $.parseHTML( "<div class='parsed-sizzle'><b>bold</b></div>" );
			$( "<div></div>" ).append( nodes ).appendTo( document.body );
			outcome.insertedText = $( "div.parsed-sizzle b" ).text();
			outcome.singleTag = $.parseHTML( "<span></span>" )[ 0 ].nodeName.toLowerCase();
			outcome.explicitContextOwner = $.parseHTML( "<i>x</i>", document )[ 0 ].ownerDocument === document;

			return outcome;
		}

		result = check( window.sizzleTestjQuery );

		// Give the url404 images time to fail and fire any injected onerror handler
		setTimeout(function() {
			window.parent.iframeCallback( result );
		}, 1500 );
	</script>
</body>
</html>
